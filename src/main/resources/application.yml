server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: utilitys-api
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
